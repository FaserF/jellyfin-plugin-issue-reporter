name: Hermes Bot

on:
  issue_comment:
    types: [created]

jobs:
  hermes:
    if: |
      !github.event.comment.user.bot &&
      (contains(github.event.comment.body, '@hermes') ||
       contains(github.event.comment.body, '@faserf-bot') ||
       contains(github.event.comment.body, '/hermes') ||
       contains(github.event.comment.body, '/fix'))
    uses: FaserF/repo-template/.github/workflows/reusable-hermes-bot.yml@v1
    secrets: inherit
